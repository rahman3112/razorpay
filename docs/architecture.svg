<svg viewBox="0 0 700 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1C2321"/>
    </marker>
  </defs>

  <rect width="700" height="660" fill="#F7F5F0"/>

  <!-- 1. Input -->
  <rect x="80" y="10" width="340" height="46" rx="8" fill="#FFFFFF" stroke="#1C2321" stroke-width="1.5"/>
  <text x="250" y="38" text-anchor="middle" font-size="15" font-weight="600" fill="#1C2321">Ledger + bank data</text>

  <line x1="250" y1="56" x2="250" y2="86" stroke="#1C2321" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Reconciliation engine -->
  <rect x="80" y="86" width="340" height="86" rx="8" fill="#FFFFFF" stroke="#1C2321" stroke-width="1.5"/>
  <text x="250" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#1C2321">Reconciliation engine</text>
  <text x="250" y="132" text-anchor="middle" font-size="12" fill="#5B6360">deterministic, indexed</text>
  <text x="250" y="150" text-anchor="middle" font-size="10.5" fill="#5B6360">EXACT → FEE_TOLERANCE → TIMING_LAG → FUZZY_REF</text>
  <text x="250" y="166" text-anchor="middle" font-size="11" fill="#5B6360">~150k records/sec</text>

  <!-- branch: matched (short diagonal to the right) -->
  <line x1="420" y1="129" x2="470" y2="129" stroke="#1C2321" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="122" text-anchor="middle" font-size="11" font-style="italic" fill="#5B6360">match</text>
  <rect x="470" y="104" width="180" height="50" rx="8" fill="#E3EEE6" stroke="#2F6E4F" stroke-width="1.5"/>
  <text x="560" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="#2F6E4F">Matched pair</text>

  <!-- continue down: exception -->
  <line x1="250" y1="172" x2="250" y2="202" stroke="#1C2321" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="278" y="192" font-size="11" font-style="italic" fill="#5B6360">exception</text>

  <!-- 3. Duplicate pre-pass -->
  <rect x="80" y="202" width="340" height="78" rx="8" fill="#FFFFFF" stroke="#1C2321" stroke-width="1.5"/>
  <text x="250" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#1C2321">Duplicate pre-pass</text>
  <text x="250" y="248" text-anchor="middle" font-size="12" fill="#5B6360">reference already matched elsewhere?</text>
  <text x="250" y="266" text-anchor="middle" font-size="11" fill="#5B6360">100% precision/recall vs. ground truth</text>

  <line x1="420" y1="241" x2="470" y2="241" stroke="#1C2321" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="234" text-anchor="middle" font-size="11" font-style="italic" fill="#5B6360">yes</text>
  <rect x="470" y="216" width="180" height="50" rx="8" fill="#E3EEE6" stroke="#2F6E4F" stroke-width="1.5"/>
  <text x="560" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#2F6E4F">RESOLVE</text>
  <text x="560" y="257" text-anchor="middle" font-size="11" fill="#2F6E4F">confidence 1.0</text>

  <line x1="250" y1="280" x2="250" y2="310" stroke="#1C2321" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="278" y="300" font-size="11" font-style="italic" fill="#5B6360">no</text>

  <!-- 4. One-sided pre-pass -->
  <rect x="80" y="310" width="340" height="88" rx="8" fill="#FFFFFF" stroke="#1C2321" stroke-width="1.5"/>
  <text x="250" y="336" text-anchor="middle" font-size="15" font-weight="600" fill="#1C2321">One-sided pre-pass</text>
  <text x="250" y="356" text-anchor="middle" font-size="12" fill="#5B6360">no counterpart anywhere on</text>
  <text x="250" y="373" text-anchor="middle" font-size="12" fill="#5B6360">the other side?</text>
  <text x="250" y="391" text-anchor="middle" font-size="11" fill="#5B6360">100% recall vs. ground truth</text>

  <line x1="420" y1="354" x2="470" y2="354" stroke="#1C2321" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="347" text-anchor="middle" font-size="11" font-style="italic" fill="#5B6360">yes</text>
  <rect x="470" y="329" width="180" height="50" rx="8" fill="#E3EEE6" stroke="#2F6E4F" stroke-width="1.5"/>
  <text x="560" y="353" text-anchor="middle" font-size="14" font-weight="600" fill="#2F6E4F">RESOLVE</text>
  <text x="560" y="370" text-anchor="middle" font-size="11" fill="#2F6E4F">confidence 1.0</text>

  <line x1="250" y1="398" x2="250" y2="428" stroke="#1C2321" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="418" text-anchor="middle" font-size="11" font-style="italic" fill="#5B6360">no - both sides present</text>

  <!-- 5. LLM classification -->
  <rect x="80" y="428" width="340" height="92" rx="8" fill="#F3E6DC" stroke="#A85A2E" stroke-width="1.5"/>
  <text x="250" y="454" text-anchor="middle" font-size="15" font-weight="600" fill="#1C2321">LLM classification</text>
  <text x="250" y="474" text-anchor="middle" font-size="12" fill="#5B6360">genuine two-sided ambiguity</text>
  <text x="250" y="491" text-anchor="middle" font-size="12" fill="#5B6360">Gemini · temperature=0, top_k=1</text>
  <text x="250" y="508" text-anchor="middle" font-size="11" fill="#5B6360">confidence 0.20–0.91 across cases</text>

  <!-- branch to RESOLVE / ESCALATE -->
  <line x1="200" y1="520" x2="160" y2="560" stroke="#1C2321" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="520" x2="400" y2="560" stroke="#1C2321" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="560" width="200" height="62" rx="8" fill="#E3EEE6" stroke="#2F6E4F" stroke-width="1.5"/>
  <text x="160" y="588" text-anchor="middle" font-size="14" font-weight="600" fill="#2F6E4F">RESOLVE</text>
  <text x="160" y="606" text-anchor="middle" font-size="11" fill="#2F6E4F">confidence &#8805; 0.75</text>

  <rect x="400" y="560" width="200" height="62" rx="8" fill="#F2E2E0" stroke="#8B2E2E" stroke-width="1.5"/>
  <text x="500" y="588" text-anchor="middle" font-size="14" font-weight="600" fill="#8B2E2E">ESCALATE</text>
  <text x="500" y="606" text-anchor="middle" font-size="11" fill="#8B2E2E">confidence &lt; 0.75 - flagged for human review</text>
</svg>
